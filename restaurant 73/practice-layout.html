<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox and practicing layouts</title>
    <style>
        .flex-sample{
            display:flex;
            flex-direction: row;
            justify-content: space-evenly;
            align-items: start;
            height: 400px;
            background-color: rgb(114, 20, 92);
        }
        .box{
            background-color: darkorange;
            padding: 30px;
            color: white;
            margin: 3px
        }
    </style>
</head>
<body>
    <!-- flex practice-->
     <section class="flex-sample">
        <div class="box">A</div>
        <div class="box">B</div>
        <div class="box">C</div>
    </section>
</body>
</html>
