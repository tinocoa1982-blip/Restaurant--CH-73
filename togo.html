<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tinoco Asian Restaurant Reservations</title>
    <link rel="stylesheet" href="mystyle.css">
</head>

<body>

    <header class="reservation-header">
        <h1>Tinoco Asian Restaurant</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="togo.html">Togo</a>
        </nav>
    </header>

    <main class="reservation-page">

        <h2>Reserve Your Table</h2>

        <p>
            Welcome to Tinoco Asian Restaurant!
            Reserve your table and enjoy our
            delicious Asian cuisine.
        </p>

        <form id="reservation-form">

            <h3>Reservation Information</h3>

            <div class="reservation-input">
                <label for="guest">Guest Name:</label>
                <input type="text" id="guest"
                       name="guest" required>
            </div>

            <div class="reservation-input">
                <label for="date">Date:</label>
                <input type="date" id="date"
                       name="date" required>
            </div>

            <div class="reservation-input">
                <label for="time">Time:</label>
                <input type="time" id="time"
                       name="time" required>
            </div>

            <div class="reservation-input">
                <label for="party">Party Size:</label>
                <input type="number" id="party"
                       name="party" min="1"
                       max="20" required>
            </div>

            <div class="reservation-input">
                <label for="status">Status:</label>

                <select id="status" name="status">
                    <option value="confirmed">Confirmed</option>
                    <option value="pending">Pending</option>
                    <option value="cancelled">Cancelled</option>
                </select>
            </div>

            <h3>Payment Information</h3>

            <div class="reservation-input">
                <label for="cardname">Name on Card:</label>
                <input type="text" id="cardname"
                       name="cardname"
                       autocomplete="cc-name"
                       required>
            </div>

            <div class="reservation-input">
                <label for="cardnumber">Card Number:</label>
                <input type="text" id="cardnumber"
                       name="cardnumber"
                       inputmode="numeric"
                       autocomplete="cc-number"
                       pattern="[0-9]{13,19}"
                       placeholder="1234567890123456"
                       required>
            </div>

            <div class="reservation-input">
                <label for="expiration">Expiration:</label>
                <input type="month" id="expiration"
                       name="expiration"
                       autocomplete="cc-exp"
                       required>
            </div>

            <div class="reservation-input">
                <label for="cvv">CVV:</label>
                <input type="password" id="cvv"
                       name="cvv"
                       inputmode="numeric"
                       autocomplete="cc-csc"
                       pattern="[0-9]{3,4}"
                       maxlength="4"
                       required>
            </div>

            <div class="button-container">
                <button class="btn" type="submit">
                    Submit Reservation
                </button>
                <button class="btn" type="reset">
                    Clear
                </button>
            </div>

        </form>

    </main>

    <script>
        document.getElementById("reservation-form")
            .addEventListener("submit", function(event) {
                event.preventDefault();
                alert("Form validated! This is a classroom demo. No reservation or payment was processed.");
            });
    </script>

</body>
</html>
